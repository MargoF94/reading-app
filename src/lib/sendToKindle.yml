# Sends a file from this repository to a Kindle by email. The Reading Log app starts it
# ("Send to Kindle") and says which file, where to, and from which email account; that
# account's app password is this repository's KINDLE_EMAIL_PASSWORD secret.
name: Send to Kindle
run-name: Send ${{ inputs.name }} to Kindle

on:
  workflow_dispatch:
    inputs:
      path:
        description: The file in this repository
        required: true
      name:
        description: Its name in the email
        required: true
      to:
        description: The Kindle's email address
        required: true
      from:
        description: The email account it's sent from (on the Kindle's approved list)
        required: true
      server:
        description: That account's mail server, host:port
        required: true

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: python
    steps:
      - name: Get the file
        env:
          FILE_PATH: ${{ inputs.path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, shutil, urllib.parse, urllib.request

          path = os.environ["FILE_PATH"]
          parts = path.split("/")
          if len(parts) < 2 or parts[0] != "files" or any(p in ("", ".", "..") for p in parts):
              raise SystemExit(f"{path} isn't one of the app's files.")
          url = "{}/repos/{}/contents/{}".format(
              os.environ["GITHUB_API_URL"], os.environ["GITHUB_REPOSITORY"], "/".join(urllib.parse.quote(p) for p in parts)
          )
          request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github.raw+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          })
          file = os.path.join(os.environ["RUNNER_TEMP"], "file")
          with urllib.request.urlopen(request, timeout=120) as response, open(file, "wb") as out:
              shutil.copyfileobj(response, out)
          print(f"Got {path} ({os.path.getsize(file)} bytes).")

      - name: Sign in to the email account
        env:
          MAIL_FROM: ${{ inputs.from }}
          MAIL_SERVER: ${{ inputs.server }}
          MAIL_PASSWORD: ${{ secrets.KINDLE_EMAIL_PASSWORD }}
        run: |
          import os, smtplib, ssl

          if not os.environ["MAIL_PASSWORD"]:
              raise SystemExit("The KINDLE_EMAIL_PASSWORD secret is missing: set up Send to Kindle again in the app.")
          host, _, port = os.environ["MAIL_SERVER"].rpartition(":")
          if port == "465":
              server = smtplib.SMTP_SSL(host, 465, context=ssl.create_default_context(), timeout=60)
          else:
              server = smtplib.SMTP(host, int(port), timeout=60)
              server.starttls(context=ssl.create_default_context())
          with server:
              server.login(os.environ["MAIL_FROM"], os.environ["MAIL_PASSWORD"])
          print(f"Signed in to {host} as {os.environ['MAIL_FROM']}.")

      - name: Send the email
        env:
          FILE_NAME: ${{ inputs.name }}
          MAIL_TO: ${{ inputs.to }}
          MAIL_FROM: ${{ inputs.from }}
          MAIL_SERVER: ${{ inputs.server }}
          MAIL_PASSWORD: ${{ secrets.KINDLE_EMAIL_PASSWORD }}
        run: |
          import os, smtplib, ssl
          from email.message import EmailMessage
          from email.utils import formatdate, make_msgid

          name = os.environ["FILE_NAME"]
          stem, _, ext = name.rpartition(".")
          kind = {"epub": "application/epub+zip", "pdf": "application/pdf"}.get(ext.lower(), "application/octet-stream")
          message = EmailMessage()
          message["From"] = os.environ["MAIL_FROM"]
          message["To"] = os.environ["MAIL_TO"]
          message["Subject"] = stem or name
          message["Date"] = formatdate()
          message["Message-ID"] = make_msgid(domain=os.environ["MAIL_FROM"].rpartition("@")[2] or None)
          message.set_content("Sent from Reading Log.")
          with open(os.path.join(os.environ["RUNNER_TEMP"], "file"), "rb") as f:
              message.add_attachment(f.read(), maintype=kind.split("/")[0], subtype=kind.split("/")[1], filename=name)

          host, _, port = os.environ["MAIL_SERVER"].rpartition(":")
          if port == "465":
              server = smtplib.SMTP_SSL(host, 465, context=ssl.create_default_context(), timeout=60)
          else:
              server = smtplib.SMTP(host, int(port), timeout=60)
              server.starttls(context=ssl.create_default_context())
          with server:
              server.login(os.environ["MAIL_FROM"], os.environ["MAIL_PASSWORD"])
              server.send_message(message)
          print(f"Sent {name} to {os.environ['MAIL_TO']}.")
