<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#34495a" />
    <!-- Home-screen app on iPhone: a solid black bar behind the time and battery. Drawing
         under it instead ("black-translucent") lets iOS 26 get the screen height wrong, so
         the bottom tabs float above the bottom edge. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="description" content="Personal tracker for books, manga, audiobooks and fanfics." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./fonts/literata.css" />
    <title>Reading Log</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
